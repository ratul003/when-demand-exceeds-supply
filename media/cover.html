<!doctype html>
<meta charset="utf-8">
<title>cover</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { width: 1200px; height: 675px; background: #0a0a0f; overflow: hidden;
         font-family: "Helvetica Neue", Inter, system-ui, sans-serif; position: relative; }
  .glow { position: absolute; border-radius: 50%; filter: blur(90px); pointer-events: none; }
  .g1 { width: 620px; height: 420px; left: -120px; top: -90px; background: rgba(6,182,212,0.16); }
  .g2 { width: 520px; height: 380px; right: -110px; bottom: -120px; background: rgba(239,68,68,0.13); }
  .wrap { position: relative; padding: 46px 56px; height: 100%; display: flex; flex-direction: column; }
  .kick { font-size: 13px; letter-spacing: .30em; color: #06b6d4; font-weight: 700; text-transform: uppercase; }
  .lede { margin-top: 14px; font-size: 27px; line-height: 1.28; color: #f1f5f9; font-weight: 600;
          letter-spacing: -0.017em; max-width: 780px; }
  .lede span { color: #64748b; font-weight: 500; }
  svg { margin-top: 6px; flex: 1; }
  .foot { font-size: 11.5px; color: #3f4a5c; line-height: 1.5; }
</style>
<div class="glow g1"></div><div class="glow g2"></div>
<div class="wrap">
  <div class="kick">Supply response to incentive</div>
  <div class="lede">Money summons a driver in ten minutes.<br><span>It does not summon a licensed expert at all.</span></div>

  <svg viewBox="0 0 1090 400" fill="none">
    <!-- grid -->
    <g stroke="rgba(255,255,255,0.055)" stroke-width="1">
      <line x1="70" y1="330" x2="1040" y2="330"/>
      <line x1="70" y1="250" x2="1040" y2="250"/>
      <line x1="70" y1="170" x2="1040" y2="170"/>
      <line x1="70" y1="90"  x2="1040" y2="90"/>
    </g>
    <g font-size="13" fill="#475569" font-family="Helvetica Neue, sans-serif" text-anchor="end">
      <text x="58" y="335">0%</text><text x="58" y="255">30%</text>
      <text x="58" y="175">60%</text><text x="58" y="95">90%</text>
    </g>
    <g font-size="13" fill="#475569" font-family="Helvetica Neue, sans-serif" text-anchor="middle">
      <text x="70"   y="360">$0</text>
      <text x="312"  y="360">$8</text>
      <text x="555"  y="360">$16</text>
      <text x="1040" y="360" text-anchor="end">$32 per session</text>
    </g>
    <line x1="70" y1="60" x2="70" y2="330" stroke="rgba(255,255,255,0.10)" stroke-width="1"/>

    <!-- hard ceiling for credentialed supply, drawn on the 60% gridline -->
    <line x1="70" y1="170" x2="1040" y2="170" stroke="#ef4444" stroke-width="1.5"
          stroke-dasharray="6 5" opacity="0.55"/>
    <text x="1036" y="160" font-size="13" fill="#ef4444" text-anchor="end"
          font-family="Helvetica Neue, sans-serif">
      capacity ceiling · credentials, session caps, no category crossover
    </text>

    <!-- interchangeable supply: steep, keeps climbing (illustrative) -->
    <path d="M70 308.7 C 150 240, 240 175, 312.5 143 C 400 118, 480 106, 555 100
             C 700 92, 880 86, 1040 83"
          stroke="#22d3ee" stroke-width="3.4" fill="none" stroke-linecap="round"/>
    <text x="1036" y="72" font-size="15" fill="#22d3ee" font-weight="600" text-anchor="end"
          font-family="Helvetica Neue, sans-serif">Interchangeable supply · vehicles</text>

    <!-- credentialed supply: rises, then flattens under the ceiling -->
    <path d="M70 308.7 C 140 292, 240 250, 312.5 228.7 C 400 205, 480 190, 555 183.3
             C 700 176, 880 172.5, 1040 171.5"
          stroke="#f59e0b" stroke-width="3.4" fill="none" stroke-linecap="round"/>
    <text x="1036" y="200" font-size="15" fill="#f59e0b" font-weight="600" text-anchor="end"
          font-family="Helvetica Neue, sans-serif">Credentialed supply · people</text>

    <!-- the three measured tiers, plotted against the same axis -->
    <g>
      <circle cx="70"    cy="308.7" r="6.5" fill="#0a0a0f" stroke="#f8fafc" stroke-width="2.4"/>
      <circle cx="312.5" cy="228.7" r="6.5" fill="#0a0a0f" stroke="#f8fafc" stroke-width="2.4"/>
      <circle cx="555"   cy="183.3" r="6.5" fill="#0a0a0f" stroke="#f8fafc" stroke-width="2.4"/>
      <g font-family="Helvetica Neue, sans-serif" fill="#f1f5f9" font-size="16" font-weight="700">
        <text x="88"    y="296" text-anchor="start">8%</text>
        <text x="312.5" y="212" text-anchor="middle">38%</text>
        <text x="555"   y="208" text-anchor="middle">55%</text>
      </g>
    </g>
  </svg>

  <div class="foot">
    Credentialed curve modelled from acceptance behaviour across a 300-expert pool; the three ringed
    points are the measured incentive tiers. Vehicle curve is illustrative.
  </div>
</div>
